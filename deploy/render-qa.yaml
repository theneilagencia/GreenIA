# Homologação independente. Criar um NOVO Blueprint com este caminho.
# Não sincronizar este arquivo com o Blueprint de produção.
services:
  - type: web
    name: greenia-qa-release
    repo: https://github.com/theneilagencia/GreenIA
    branch: qa/quickwin-pesquisa-bloqueada-20261018
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/entrada-qa.sh
    region: virginia
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /api/saude
    disk:
      name: dados-qa-novos
      mountPath: /app/dados
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MULTIEMPRESA
        value: '1'
      - key: COOKIE_SEGURO
        value: '1'
      - key: BANCO_PLATAFORMA
        value: /app/dados/qa/plataforma.sqlite
      - key: PASTA_EMPRESAS
        value: /app/dados/qa/empresas
      - key: BANCO
        value: /app/dados/qa/legado-inexistente.sqlite
      - key: PLATAFORMA_ADMINS_ARQUIVO
        value: /app/dados/qa/admins-nao-importados.txt
      - key: PLATAFORMA_FUSO
        value: America/Sao_Paulo
      - key: PLATAFORMA_ADMINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMAIL_API
        value: resend
      - key: EMAIL_API_CHAVE
        sync: false
      - key: SMTP_REMETENTE
        sync: false
