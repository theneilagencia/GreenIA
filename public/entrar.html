<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · GreenIA</title>
<link rel="icon" href="/assets/greenia-marca.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main class="login">
  <div class="login-cartao">
    <div class="marca"><img src="/assets/greenia-marca.svg" width="26" height="26" alt="" aria-hidden="true"><span>Green<span class="ia">IA</span></span></div>
    <h1>Entre com o seu email da empresa.</h1>
    <p class="texto" id="explica">A GreenIA é interna. Você recebe um código de acesso de 6 dígitos no seu email.</p>
    <form id="form-email" novalidate>
      <div class="campo"><label for="email">Email da empresa</label>
        <input class="entrada" id="email" type="email" autocomplete="email" required placeholder="nome@empresa.com.br"></div>
      <p class="msg-erro oculto" id="erro-email" role="alert"></p>
      <button class="btn btn-verde" style="width:100%;border-radius:12px;padding:15px" id="btn-email">Receber código</button>
    </form>
    <form id="form-codigo" class="oculto" novalidate>
      <div class="campo"><label for="codigo">Código de acesso</label>
        <input class="entrada" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000">
        <span class="ajuda" id="enviado-para"></span></div>
      <p class="msg-erro oculto" id="erro-codigo" role="alert"></p>
      <button class="btn btn-verde" style="width:100%;border-radius:12px;padding:15px" id="btn-codigo">Entrar</button>
      <button type="button" class="btn-texto" id="trocar" style="margin-top:10px">Usar outro email</button>
    </form>
    <div class="privacidade"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg><p style="margin:0" data-privacidade></p></div>
    <a class="btn-texto" href="/" style="display:inline-block;margin-top:14px;color:var(--muted);padding-left:0">← Voltar à apresentação</a>
  </div>
</main>
<script type="module" src="/entrar.js"></script>
</body>
</html>
