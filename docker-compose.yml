# Ambiente local completo: Postgres com pgvector, Redis, S3 compatível (MinIO),
# SMTP de teste (Mailpit) e o servidor da GreenIA.
#   docker compose up --build
#   docker compose run --rm app node src/scripts/create-tenant.ts deploy/tenant-local.json
# Depois: http://localhost:8080 (emails de login em http://localhost:8025).
# Em produção (AWS sa-east-1), cada serviço vira o gerenciado equivalente: ver README.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: greenia
      POSTGRES_PASSWORD: dono-local
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d greenia" ]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes: [ "redisdata:/data" ]

  minio:
    image: quay.io/minio/minio:latest
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: greenia
      MINIO_ROOT_PASSWORD: greenia-local-123
      # Chave local para aceitar criptografia em repouso (SSE-S3), como no S3.
      MINIO_KMS_SECRET_KEY: "greenia-local:MzJieXRlc2xvbmdzZWNyZXRrZXltdXN0YmVwcm92aWQ="
    volumes: [ "miniodata:/data" ]
    ports: [ "9001:9001" ]

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [ minio ]
    entrypoint: [ "sh", "-c", "until mc alias set local http://minio:9000 greenia greenia-local-123; do sleep 1; done; mc mb -p local/greenia-documentos" ]

  mailpit:
    image: axllent/mailpit:latest
    ports: [ "8025:8025" ]

  migrate:
    build: .
    command: [ "node", "src/db/migrate.ts" ]
    environment:
      DATABASE_OWNER_URL: postgres://postgres:dono-local@db:5432/greenia
      APP_DB_USER: greenia_srv
      APP_DB_PASSWORD: servidor-local
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    env_file: [ ".env.local.example" ]
    ports: [ "8080:8080" ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
